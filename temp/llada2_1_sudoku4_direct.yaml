# Isolated prompt diagnostic. Data and outputs stay under temp/.
base_dir: ..
output_root: temp/output
output_stage: model_output

models:
  - config: configs/models/llada2_1.yaml
    variants: [qmode, smode]
  - config: configs/models/diffusiongemma.yaml
    variants: [official]

datasets:
  - config: configs/datasets/sudoku4.yaml
    samples_file: temp/data/sudoku4_direct_short.jsonl
    n_samples: 100
    max_new_tokens: 32

seed: 42
resource_measurement: reuse_formal_samples
trace_scope: all_samples
