# Appendix D.4 — large-model reference, not part of same-scale conclusions
# (section 5). Public checkpoint, loaded via the real upstream
# `DiffusionGemmaForBlockDiffusion` class + `AutoProcessor` — verified
# against the DiffusionGemma reference project's own model-loading code
# (transformers>=5.13.0 required: this class isn't in older releases, a
# newer floor than this project's default `hf` extra — install with e.g.
# `pip install "transformers>=5.13.0"` for DiffusionGemma specifically). No
# `trust_remote_code` needed; it's a real registered model type, not remote
# code. Trace capture wraps `accept_canvas` via an instance-level override of
# `model._prepare_sampler` (see models/diffusiongemma.py) — following *How
# DiffusionGemma Actually Commits Tokens*, corrected against the real method
# signature. Only one config, kept under the same `configs:` schema as every
# other model.
#
# `model_name_or_path` is an HF Hub repo id — `from_pretrained` downloads it
# on first use into ./data/huggingface (see dllm_bench/hf_cache.py), not a local
# path. `python prepare_model.py --model-config configs/models/diffusiongemma.yaml`
# downloads that snapshot ahead of time without loading it into RAM/GPU.
#
# DiffusionGemma is excluded from the Best/Fast steps=1024/512 framework
# because it is a large-model reference rather than a same-scale comparison.
# Its one `official` variant uses the checkpoint's shipped Entropy Bound
# sampler and Google's recommended maximum of 48 denoising steps per canvas.
# The checkpoint generation config supplies temperature 0.8 -> 0.4, entropy
# bound 0.1, confidence 0.005, and stability threshold 1.
# The adapter does not override `disable_compile`; cache/compile behavior is
# left to the upstream generation config. The official `tokens_per_forward`
# output is persisted, and post-EOS pads are excluded from valid length/trace.
model: diffusiongemma
max_context_tokens: 262144
configs:
  official:
    adapter: dllm_bench.models.diffusiongemma.DiffusionGemmaAdapter
    init_kwargs:
      model_name_or_path: google/diffusiongemma-26B-A4B-it
      steps: 48
