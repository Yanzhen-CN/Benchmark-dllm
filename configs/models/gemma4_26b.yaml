# Architecture- and scale-matched autoregressive control for DiffusionGemma.
# The checkpoint's generation_config supplies Google's official sampling
# parameters: do_sample=true, temperature=1.0, top_p=0.95, top_k=64.
model: gemma4_26b
max_context_tokens: 262144
configs:
  # The report stage recognizes this role name as the comparison baseline;
  # generation still comes from the checkpoint's official sampling config.
  ar-baseline:
    adapter: dllm_bench.models.gemma4_ar.Gemma4ARAdapter
    init_kwargs:
      model_name_or_path: google/gemma-4-26B-A4B-it
      enable_thinking: false
