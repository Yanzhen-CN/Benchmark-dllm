# Appendix D.2 — one model, one file, both configs nested under `configs:`.
# Best and Fast are tested together in one process by default (see cli.py /
# README "atomic unit = model") — they share this same checkpoint, so it
# only gets loaded once (models/model_cache.py).
#
# `model_name_or_path` is an HF Hub repo id, NOT a local filesystem path —
# `from_pretrained` downloads it on first use into the HF cache (see
# dllm_bench/hf_cache.py: defaults to ./.hf_cache under the current
# directory rather than ~/.cache/huggingface). Run `python prepare_model.py
# --model-config configs/models/dream.yaml` to warm that cache ahead of time.
#
# UNLIKE illada.yaml/dg.yaml: no local reference implementation was
# available for Dream when this was written (see models/dream.py's module
# docstring) — checkpoint id and generation parameters below are from
# Dream-7B's publicly documented HF model card, not verified against a local
# reference. Confirm before formal runs.
model: dream
configs:
  best:
    # gen_length=1024, steps=1024. When a task's output cap is below 1024,
    # use steps = gen_length instead (set at the experiment level).
    adapter: dllm_bench.models.dream.DreamAdapter
    init_kwargs:
      model_name_or_path: Dream-org/Dream-v0-Instruct-7B
    step_config:
      gen_length: 1024
      steps: 1024
      extra:
        temperature: 0.2
        top_p: 0.95
        alg: entropy
        alg_temp: 0.0
  fast:
    # gen_length=1024, steps=512. When a task's output cap is below 1024,
    # use steps = gen_length / 2 instead (set at the experiment level).
    adapter: dllm_bench.models.dream.DreamAdapter
    init_kwargs:
      model_name_or_path: Dream-org/Dream-v0-Instruct-7B
    step_config:
      gen_length: 1024
      steps: 512
      extra:
        temperature: 0.2
        top_p: 0.95
        alg: entropy
        alg_temp: 0.0
