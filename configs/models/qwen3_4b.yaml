# Appendix D.5 — AR baseline. Standard HF checkpoint + generate() + greedy
# decoding. max_new_tokens is set per-experiment (aligned to that task's
# dLLM output budget), not hardcoded here. Only one config (no Best/Fast
# split for the AR baseline), but kept under the same `configs:` schema as
# every other model for a uniform loader.
#
# `model_name_or_path` is an HF Hub repo id — `from_pretrained` downloads it
# on first use into ./.data/huggingface (see dllm_bench/hf_cache.py), not a local
# path. `python prepare_model.py --model-config configs/models/qwen3_4b.yaml`
# warms that cache ahead of time.
model: qwen3_4b
max_context_tokens: 40960
configs:
  ar-baseline:
    adapter: dllm_bench.models.hf_ar.QwenARAdapter
    init_kwargs:
      model_name_or_path: Qwen/Qwen3-4B
      # Use the checkpoint's instruction template without spending the
      # benchmark output budget on Qwen3's optional reasoning preamble.
      enable_thinking: false
