# Marker-free compact-output companion to the main sudoku9 direct-answer
# protocol. It reuses the exact frozen rows, Easy/Hard split, semantic scorer,
# and references so complete 81-digit candidates can be decoded from
# intermediate diffusion canvases for cell-revision analysis.
dataset: sudoku_trace
dataset_class: dllm_bench.datasets.sudoku9.SudokuTraceDataset
primary_metric: complete_reference_sequence_accuracy
aux_metrics:
  - reference_exact_match
  - strict_reference_exact_match
  - strict_81_digit_format_rate
  - direct_answer_instruction_following_rate
  - exact_solve_rate
  - blank_cell_accuracy
  - blank_cell_accuracy_by_difficulty
  - exact_solve_rate_by_difficulty
  - cell_accuracy
  - given_preservation_rate
  - constraint_satisfaction_rate
  - completion_rate
  - conflict_rate
  - trace_revision_count
  - trace_parseable_step_rate
  - trace_correction_success_rate
sample_size: 10
difficulty_counts:
  easy: 5
  hard: 5
seed: 42
dataset_kwargs:
  easy_count: 5
  hard_count: 5
  seed: 42
trace_scope: all_samples
