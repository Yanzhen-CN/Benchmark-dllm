# Compact-output companion to the sudoku9 reasoning protocol. It reuses
# the exact frozen source rows, Easy/Hard split, semantic scorer, and reference
# solutions, but forbids reasoning text so complete 81-digit candidates can be
# decoded from intermediate diffusion canvases for cell-revision analysis.
dataset: sudoku_trace
dataset_class: dllm_bench.datasets.sudoku.SudokuTraceDataset
primary_metric: extracted_solution_constraint_accuracy
aux_metrics:
  - reference_exact_match
  - official_exact_match_accuracy
  - official_format_valid
  - direct_answer_instruction_following_rate
  - exact_solve_rate
  - blank_cell_accuracy
  - blank_cell_accuracy_by_difficulty
  - exact_solve_rate_by_difficulty
  - cell_accuracy
  - given_preservation_rate
  - constraint_satisfaction_rate
  - completion_rate
  - conflict_rate
  - trace_revision_count
  - trace_parseable_step_rate
  - trace_correction_success_rate
sample_size: 10
difficulty_counts:
  easy: 5
  hard: 5
seed: 42
dataset_kwargs:
  easy_count: 5
  hard_count: 5
  seed: 42
trace_scope: all_samples
