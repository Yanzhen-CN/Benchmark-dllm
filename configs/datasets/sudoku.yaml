dataset: sudoku
dataset_class: dllm_bench.datasets.sudoku.SudokuDataset
primary_metric: official_exact_match_accuracy
aux_metrics: [accuracy_easy, accuracy_hard]
sample_size: 100
difficulty_counts:
  easy: 50
  hard: 50
seed: 42
# Official Ye et al. / Park protocol: raw 81-digit puzzle (0 = blank), raw
# 81-digit solution, whole-sequence exact-match scoring. Rows 100000..100999
# of the source million-game file are the official test split. Easy/Hard is
# our reporting-only stratum on that unchanged split: <=5 versus >=6
# synchronous naked-single rounds. The selected formal subset is 50/50.
