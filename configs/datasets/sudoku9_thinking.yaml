# Reference-only long-reasoning companion to the main direct-answer Sudoku9
# track. It reuses the same Park/Ye split and scorer while forcing the original
# marked reasoning prompt through Sudoku9ThinkingDataset.
dataset: sudoku9_thinking
dataset_class: dllm_bench.datasets.sudoku9.Sudoku9ThinkingDataset
primary_metric: extracted_solution_constraint_accuracy
aux_metrics:
  - reference_exact_match
  - official_exact_match_accuracy
  - official_format_valid
  - direct_answer_instruction_following_rate
  - answer_marker_complete_rate
  - exact_solve_rate
  - blank_cell_accuracy
  - blank_cell_accuracy_by_difficulty
  - exact_solve_rate_by_difficulty
  - cell_accuracy
  - given_preservation_rate
  - constraint_satisfaction_rate
  - completion_rate
  - conflict_rate
  - accuracy_easy
  - accuracy_hard
sample_size: 100
difficulty_counts:
  easy: 50
  hard: 50
seed: 42
dataset_kwargs:
  easy_count: 50
  hard_count: 50
  seed: 42
