dataset: structeval_t
dataset_class: dllm_bench.datasets.structeval_t.StructEvalTDataset
# Official non-renderable StructEval score:
# round(0.2 * render_score + 0.8 * key_validation_score, 2).
primary_metric: final_eval_score
aux_metrics: [official_render_score, official_key_validation_score, complete_correct_rate, structure_progress, content_progress, complete_rate, truncated_rate, answer_region_detected_rate, answer_position_token_mapped_rate, answer_start_ratio, answer_marker_complete_rate, style_trace_mappable_rate, style_eligible_ratio, answer_local_structure_first_score]
sample_size: 100
seed: 42
# Generation traces are retained for every formal sample. Strategy analysis
# can therefore use the complete 100-sample run instead of a separate subset.
trace_scope: all_samples
