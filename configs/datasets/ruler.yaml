# Controlled long-input comparison. Every model runs the same 8192-token
# context-window point. Model-advertised maxima remain checkpoint metadata and
# are not mixed into the formal quality/resource comparison. The prompt uses
# window - 64 tokens so the short answer remains inside the legal total length.
dataset: ruler
dataset_class: dllm_bench.datasets.ruler.RulerDataset
primary_metric: official_string_match_all
aux_metrics: [all_answers_match, position_robustness]
task_types: [niah, multi_hop, aggregation]
positions: [front, middle, back]
samples_per_context_window_position: 10
common_context_window_tokens: 8192
include_model_max_context_window: false
max_output_tokens: 64
seed: 42
dataset_kwargs:
  context_windows: [8192]
  samples_per_context_window_position: 10
  max_output_tokens: 64
  seed: 42
