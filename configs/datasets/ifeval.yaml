dataset: ifeval
dataset_class: dllm_bench.datasets.ifeval.IFEvalDataset
primary_metric: prompt_level_strict_accuracy
aux_metrics: [instruction_level_strict, prompt_level_loose, instruction_level_loose]
sample_size: 150
seed: 42
# Appendix A.3 — generation-strategy subset (section 4.3): 20-30 samples each
# containing >=1 observable form constraint AND >=1 deterministic content
# requirement, prioritizing Section+Content / List+Keywords / Heading+Items /
# Format+Limits+Content combinations.
strategy_subset_size: 25
