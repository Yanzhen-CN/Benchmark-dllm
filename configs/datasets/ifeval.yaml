dataset: ifeval
dataset_class: dllm_bench.datasets.ifeval.IFEvalDataset
primary_metric: prompt_level_strict_accuracy
aux_metrics:
  - instruction_level_strict
  - prompt_level_loose
  - instruction_level_loose
  - constraint_progress
  - content_progress
sample_size: 100
seed: 42
# Formal files use the normalized InstructionSpec representation documented in
# dllm_bench.datasets.ifeval. The current checker registry covers the
# observable form + deterministic content subset used by Appendix A.3.
