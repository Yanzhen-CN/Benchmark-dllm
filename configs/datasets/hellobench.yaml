# Diagnostic long-output evaluation: short prompts, 10 samples at each of the
# 2K/4K-word targets. Generation caps are per sample, not a matrix-wide 256.
dataset: hellobench
dataset_class: dllm_bench.datasets.hellobench.HelloBenchDataset
primary_metric: helloeval_score
aux_metrics: [length_compliance_rate, seq_rep_4]
samples_per_length: 10
output_profiles:
  - target_words: 2000
    max_new_tokens: 3072
  - target_words: 4000
    max_new_tokens: 6144
seed: 42
# NOTE: HelloEval is an LLM-judge rubric in the real benchmark. Without a
# judge_fn wired in, HelloBenchDataset falls back to a repetition+length
# heuristic that is NOT the real metric (see dllm_bench/datasets/hellobench.py).
judge_fn: null
