# Diagnostic long-output evaluation: 10 shared samples at each of the
# 2K/4K-word targets (20 total per model configuration). This remains a
# focused system evaluation rather than a full HelloBench leaderboard run.
# Generation caps are per sample, not a matrix-wide 256.
dataset: hellobench
dataset_class: dllm_bench.datasets.hellobench.HelloBenchDataset
# This deliberately does not claim to be official HelloEval: official
# HelloEval requires checklist-based LLM judging. The offline primary score
# combines objective length/repetition/segment signals and explicit major
# observable failure penalties.
primary_metric: objective_quality_score
aux_metrics: [length_compliance_rate, seq_rep_4, repeated_segment_fraction, major_issue_free_rate, refusal_issue_rate, prompt_echo_issue_rate, corrupt_text_issue_rate, generation_time_mean_seconds_by_length, generation_time_median_seconds_by_length, generation_success_rate_by_length]
samples_per_length: 10
output_profiles:
  - target_words: 2000
    max_new_tokens: 3072
  - target_words: 4000
    max_new_tokens: 6144
seed: 42
# Task 2 evaluates final long-output quality and resources only. Persisting a
# full per-forward, per-position trace for 2K/4K-word outputs is prohibitively
# large and is not used by the HelloBench score or retention calculation.
trace_scope: none
