# Diagnostic long-output feasibility evaluation: one shared sample at each of
# the 2K/4K-word targets by default. The full matrix restricts iLLaDA and
# DreamReasoner to the 2K-word profile only (one sample per variant).
# Generation caps are per sample, not a matrix-wide 256.
dataset: hellobench
dataset_class: dllm_bench.datasets.hellobench.HelloBenchDataset
# This deliberately does not claim to be official HelloEval: official
# HelloEval requires checklist-based LLM judging. The offline primary score
# combines objective length/repetition/segment signals and explicit major
# observable failure penalties.
primary_metric: objective_quality_score
aux_metrics:
  - length_compliance_rate
  - complete_rate
  - truncated_rate
  - seq_rep_4
  - repeated_segment_fraction
  - empty_output_issue_rate
  - severe_underlength_issue_rate
  - severe_overlength_issue_rate
  - high_repetition_issue_rate
  - repeated_segment_loop_issue_rate
  - refusal_issue_rate
  - prompt_echo_issue_rate
  - corrupt_text_issue_rate
  - major_issue_count
  - major_issue_free_rate
  - generation_time_mean_seconds_by_length
  - generation_time_median_seconds_by_length
  - generation_success_rate_by_length
  - case_study_only
  - official_helloeval_compatible
samples_per_length: 1
output_profiles:
  - target_words: 2000
    max_new_tokens: 3072
  - target_words: 4000
    max_new_tokens: 6144
seed: 42
# Task 2 evaluates final long-output quality and resources only. Persisting a
# full per-forward, per-position trace for 2K/4K-word outputs is prohibitively
# large and is not used by the HelloBench score or retention calculation.
trace_scope: none
