dataset: sudoku9
dataset_class: dllm_bench.datasets.sudoku.Sudoku9Dataset
primary_metric: extracted_solution_constraint_accuracy
aux_metrics:
  - reference_exact_match
  - official_exact_match_accuracy
  - official_format_valid
  - direct_answer_instruction_following_rate
  - answer_marker_complete_rate
  - exact_solve_rate
  - blank_cell_accuracy
  - blank_cell_accuracy_by_difficulty
  - exact_solve_rate_by_difficulty
  - cell_accuracy
  - given_preservation_rate
  - constraint_satisfaction_rate
  - completion_rate
  - conflict_rate
  - accuracy_easy
  - accuracy_hard
sample_size: 100
difficulty_counts:
  easy: 50
  hard: 50
seed: 42
dataset_kwargs:
  easy_count: 50
  hard_count: 50
  seed: 42
# Park 9x9 split used by Ye et al. Main large-model runs use all 50+50 rows;
# compact-model overrides select a deterministic 5+5 diagnostic subset.
