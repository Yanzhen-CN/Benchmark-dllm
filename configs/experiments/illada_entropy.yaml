# Focused iLLaDA entropy-acceptance comparison on GSM8K.
base_dir: ../..
output_root: output/model_output
output_stage: model_output

models:
  - config: configs/models/illada_entropy.yaml
    variants: [eb03, eb05, eb1]

datasets:
  - config: configs/datasets/gsm8k.yaml
    max_new_tokens: 512

seed: 42
resource_measurement: reuse_formal_samples
trace_scope: all_samples
