# Native DiffusionGemma-vs-Gemma-4 comparison plus one deployment-optimized
# Gemma+DFlash row. The same row is selectable from full_matrix; this smaller
# matrix remains a convenient three-way Gemma-family comparison.
base_dir: ../..

models:
  - config: configs/models/diffusiongemma.yaml
    variants: [official]
  - config: configs/models/gemma.yaml
    variants: [ar-baseline]
  - config: configs/models/gemma_dflash.yaml
    variants: [dflash]

datasets:
  - configs/datasets/gsm8k.yaml
  - configs/datasets/mbpp.yaml
  - configs/datasets/structeval_t.yaml
  - config: configs/datasets/sudoku4.yaml
    n_samples: 10
    max_new_tokens: 256
  - config: configs/datasets/sudoku9.yaml
    max_new_tokens: 256
  - config: configs/datasets/ruler.yaml
    max_new_tokens: 64
  - config: configs/datasets/hellobench.yaml
    max_new_tokens: 6144

seed: 42
resource_measurement: reuse_formal_samples
trace_scope: all_samples
