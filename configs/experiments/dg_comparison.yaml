# Convenience subset for the controlled DiffusionGemma-vs-Gemma-4 comparison.
# Both models are also present in full_matrix; use this smaller matrix to run
# only the matched pair sequentially on the same physical A100 80GB.
base_dir: ../..

models:
  - config: configs/models/diffusiongemma.yaml
    variants: [official]
  - config: configs/models/gemma4_26b_a4b.yaml
    variants: [ar-baseline]

datasets:
  - configs/datasets/gsm8k.yaml
  - configs/datasets/mbpp.yaml
  - configs/datasets/structeval_t.yaml
  - config: configs/datasets/sudoku4.yaml
    n_samples: 10
    max_new_tokens: 128
  - config: configs/datasets/sudoku9.yaml
    max_new_tokens: 256
  - configs/datasets/sudoku_trace.yaml
  - config: configs/datasets/ruler.yaml
    max_new_tokens: 64
  - config: configs/datasets/hellobench.yaml
    max_new_tokens: 6144

seed: 42
resource_measurement: reuse_formal_samples
trace_scope: all_samples
