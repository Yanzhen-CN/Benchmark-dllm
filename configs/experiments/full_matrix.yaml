# Reference list of the section-5 model x dataset matrix (11 formal configs x
# 6 datasets, including the same-scale DiffusionGemma/Gemma 4 reference pair).
# This is consumed by `dllm-bench matrix`. Dataset entries may
# also be mappings with
# `config`, `samples_file`, and task-specific `max_new_tokens` fields.
#
# Each model config file may declare multiple named variants under `configs:`
# (see e.g. configs/models/illada.yaml). The `variants` list below declares
# the formal sampling profiles for each model.

base_dir: ../..

models:
  - config: configs/models/qwen3_4b.yaml  # AR reference model
    variants: [ar-baseline]
  - config: configs/models/qwen3_8b.yaml  # same-scale AR reference for 8B dLLMs
    variants: [ar-baseline]
  - config: configs/models/illada.yaml    # illada-8B
    variants: [best, fast]
  - config: configs/models/dreamreasoner.yaml # dream reasoner-8B
    variants: [best, fast]
  - config: configs/models/w1.yaml  # w1-instruct-4B
    variants: [standard, jump, gidd]  # sampler difference
  - config: configs/models/diffusiongemma.yaml
    variants: [official]
  - config: configs/models/gemma4_26b_a4b.yaml
    variants: [ar-baseline] # same-scale AR reference for DiffusionGemma

datasets:
  - configs/datasets/gsm8k.yaml
  - configs/datasets/mbpp.yaml
  - configs/datasets/structeval_t.yaml
  - config: configs/datasets/sudoku.yaml
    max_new_tokens: 96
  - config: configs/datasets/ruler.yaml
    max_new_tokens: 64  # fallback; formal samples also carry this per sample
  - config: configs/datasets/hellobench.yaml
    max_new_tokens: 6144  # fallback; 2K samples override this to 3072

seed: 42

# Resource metrics reuse these same formal generations. Every adapter that can
# expose decoding history records a full per-sample trace; no extra 20–30 sample
# strategy run is scheduled.
resource_measurement: reuse_formal_samples
trace_scope: all_samples
