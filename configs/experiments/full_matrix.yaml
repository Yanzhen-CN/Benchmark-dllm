# Reference list of the section-5 model x dataset matrix (9 model configs x
# 9 task datasets plus one isolated context-capacity diagnostic).
# This is consumed by `dllm-bench matrix`. Dataset entries may
# also be mappings with
# `config`, `samples_file`, and task-specific `max_new_tokens` fields.
#
# Each model config file may declare multiple named variants under `configs:`
# (see e.g. configs/models/illada.yaml). The `variants` list below declares
# the formal sampling profiles for each model.

base_dir: ../..

models:
  - config: configs/models/qwen3_4b.yaml  # AR reference model
    variants: [ar-baseline]
    dataset_overrides:
      sudoku4:
        n_samples: 1
      sudoku9:
        n_samples: 1
  - config: configs/models/qwen3_8b.yaml  # same-scale AR reference for 8B dLLMs
    variants: [ar-baseline]
    dataset_overrides:
      sudoku9:
        n_samples: 10
  - config: configs/models/illada.yaml    # illada-8B
    variants: [p1, p2]
    dataset_overrides:
      sudoku4:
        n_samples: 1
      sudoku9:
        n_samples: 1
      hellobench:
        hellobench_lengths: [2k]
        n_samples: 1
  - config: configs/models/illada_vargen.yaml # official incremental block canvas
    variants: [p1, p2]
    dataset_overrides:
      sudoku4:
        n_samples: 1
      sudoku9:
        n_samples: 1
      hellobench:
        hellobench_lengths: [2k]
        n_samples: 1
  - config: configs/models/dreamreasoner.yaml # dream reasoner-8B
    variants: [p1, p2]
    dataset_overrides:
      sudoku4:
        n_samples: 1
      sudoku9:
        n_samples: 1
      hellobench:
        hellobench_lengths: [2k]
        n_samples: 1
  - config: configs/models/w1.yaml  # w1-instruct-4B
    variants: [standard, jump, gidd]  # sampler difference
    dataset_overrides:
      sudoku9:
        n_samples: 10
  - config: configs/models/diffusiongemma.yaml
    variants: [official]
    dataset_overrides:
      sudoku4:
        n_samples: 10
  - config: configs/models/gemma.yaml
    variants: [ar-baseline] # same-scale AR reference for DiffusionGemma
    dataset_overrides:
      sudoku4:
        n_samples: 10
  - config: configs/models/gemma_dflash.yaml
    variants: [dflash] # deployment-optimized Gemma; not a native baseline
    dataset_overrides:
      sudoku4:
        n_samples: 10

datasets:
  - config: configs/datasets/gsm8k.yaml
    max_new_tokens: 512
  - config: configs/datasets/mbpp.yaml
    max_new_tokens: 512
  - config: configs/datasets/structeval_t.yaml
    # Structured payloads frequently exceed the former 256-token cap. Use a
    # uniform 512-token first-pass cap; 1024 is reserved for a sensitivity
    # rerun when a model still shows material cap-hit truncation.
    max_new_tokens: 512
  - config: configs/datasets/sudoku4.yaml
    max_new_tokens: 256
  - config: configs/datasets/sudoku9.yaml
    max_new_tokens: 256
  # Reference-only long-reasoning rows: prepare all 100 prompt variants, then
  # run the same deterministic first sample for every model.
  - config: configs/datasets/sudoku4_thinking.yaml
    max_new_tokens: 2048
    n_samples: 1
  - config: configs/datasets/sudoku9_thinking.yaml
    max_new_tokens: 2048
    n_samples: 1
  - config: configs/datasets/ruler.yaml
    max_new_tokens: 64  # fallback; formal samples also carry this per sample
  - config: configs/datasets/hellobench.yaml
    max_new_tokens: 6144  # fallback; 2K samples override this to 3072
  # Keep this last: an expected OOM here must occur only after every formal
  # timing row for the model has completed.
  - config: configs/datasets/ruler_context_probe.yaml
    max_new_tokens: 64

seed: 42

# Resource metrics reuse these same formal generations. Every adapter that can
# expose decoding history records a full per-sample trace; no extra 20–30 sample
# strategy run is scheduled.
resource_measurement: reuse_formal_samples
trace_scope: all_samples
