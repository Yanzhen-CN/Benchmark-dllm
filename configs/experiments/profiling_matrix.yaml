# Profiling is a second model-output tree with the same artifacts and directory
# structure as model_output. The only protocol differences are the reduced
# 3 model operating points x 3 representative tasks matrix and the additional
# profiling metrics enabled by --measure-compute. Formal full_matrix runs are
# unaffected.
# With the pinned dataset revisions and seed 42, n_samples=10 selects the same
# fixed samples for every model so timing, energy, and forward metrics can be
# summarized over a less noisy set. Confirm each generated _meta.json before use.

base_dir: ../..
# Concrete root of the parallel model-output tree.
output_root: output/model_profiling
output_stage: model_profiling

models:
  - config: configs/models/diffusiongemma.yaml
    variants: [official]
  - config: configs/models/illada.yaml
    variants: [p2]
  - config: configs/models/dreamreasoner.yaml
    variants: [p2]

datasets:
  - config: configs/datasets/mbpp.yaml
    n_samples: 10
    max_new_tokens: 512
  - config: configs/datasets/gsm8k.yaml
    n_samples: 10
    max_new_tokens: 512
  - config: configs/datasets/structeval_t.yaml
    n_samples: 10
    max_new_tokens: 512

seed: 42
capture_trace: false
profiling_output: true
