# Deep profiling uses one fixed sample per row because Torch operator/module
# tracing is intentionally expensive. It compares four model execution paths
# on the same three tasks with one unified in-repository measurement protocol.

base_dir: ../..
# Concrete root of the parallel model-output tree.
output_root: output/model_profiling
output_stage: model_profiling

models:
  - config: configs/models/diffusiongemma.yaml
    variants: [official]
  - config: configs/models/illada.yaml
    variants: [p2]
  - config: configs/models/illada_vargen.yaml
    variants: [p2]
  - config: configs/models/dreamreasoner.yaml
    variants: [p2]

datasets:
  - config: configs/datasets/mbpp.yaml
    n_samples: 1
    max_new_tokens: 512
  - config: configs/datasets/gsm8k.yaml
    n_samples: 1
    max_new_tokens: 512
  - config: configs/datasets/structeval_t.yaml
    n_samples: 1
    max_new_tokens: 512

seed: 42
capture_trace: false
profiling_output: true
