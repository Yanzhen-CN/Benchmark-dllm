[project]
name = "dllm-bench"
version = "0.1.0"
description = "Benchmark harness for diffusion LLMs vs AR baseline: task quality, long-context, resource cost, and generation-process analysis."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "click>=8.1",
    "matplotlib>=3.7",
    "pillow>=10.0",
]

[project.optional-dependencies]
hf = [
    "torch>=2.1",
    "transformers>=4.40",
]
gpu = [
    "pynvml>=11.5",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
dllm-bench = "dllm_bench.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
